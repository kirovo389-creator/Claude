plugins {
    id "com.android.application"
}

android {
    namespace "com.kirovo389.workbench"
    compileSdk 35

    defaultConfig {
        applicationId "com.kirovo389.workbench"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
}
